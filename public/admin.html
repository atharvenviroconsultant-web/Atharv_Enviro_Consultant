<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AEC | Admin Panel</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="/public/images/logo.jpeg">
<link rel="shortcut icon" type="image/png" href="/public/images/logo.jpeg">
<link rel="apple-touch-icon" href="/public/images/logo.jpeg">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Poppins,sans-serif;background:#f3f6f9;color:#263238;padding:20px}
.container{max-width:850px;margin:30px auto}
.header{background:#123b35;color:#fff;padding:22px;border-radius:12px;margin-bottom:25px}
.header h2{font-size:23px}.header p{font-size:13px;margin-top:5px;color:#d5e7df}
.card{background:#fff;padding:25px;border-radius:12px;margin-bottom:22px;box-shadow:0 3px 15px #0000000d}
h3{margin-bottom:18px;color:#123b35}
input,textarea,select{width:100%;padding:13px;border:1px solid #ddd;border-radius:7px;margin-bottom:15px;font-family:inherit;font-size:14px;background:#fff}
textarea{min-height:110px;resize:vertical}
button{border:0;padding:12px 20px;border-radius:7px;cursor:pointer;font-family:inherit;font-weight:600}
.primary{background:#147d55;color:#fff;width:100%}
.delete{background:#dc3545;color:#fff}
.logout{background:#fff;color:#123b35;float:right}
button:disabled{opacity:.6;cursor:not-allowed}
#dashboard,#loginSection{display:none}
#status,#loginStatus{margin-top:12px;font-size:13px;overflow-wrap:anywhere}
.project{display:flex;align-items:center;gap:15px;border-bottom:1px solid #eee;padding:15px 0}
.project img{width:85px;height:75px;object-fit:cover;border-radius:7px}
.project-info{flex:1;min-width:0}.project-info p{font-size:12px;color:#777;overflow-wrap:anywhere}
.project-info small{color:#147d55}
@media(max-width:500px){body{padding:10px}.container{margin:10px auto}.card{padding:18px}.project{flex-wrap:wrap}.project-info{min-width:130px}}
</style>
</head>
<body>
<div class="container">

<section id="loginSection" class="card">
    <h2>AEC Admin Login</h2>
    <p style="margin:10px 0 20px;color:#777">Login to manage your projects.</p>
    <form id="loginForm">
        <input type="email" id="email" placeholder="Admin Email" autocomplete="username" required>
        <input type="password" id="password" placeholder="Password" autocomplete="current-password" required>
        <button class="primary" type="submit" id="loginBtn">Login</button>
    </form>
    <p id="loginStatus" role="status"></p>
</section>

<section id="dashboard">
    <div class="header">
        <button class="logout" id="logoutBtn" type="button">Logout</button>
        <h2>AEC Admin Dashboard</h2>
        <p>Atharv Enviro Consultant | Project Management</p>
    </div>

    <div class="card">
        <h3>Add New Project</h3>
        <form id="projectForm">
            <input type="text" id="projectName" placeholder="Project Name" maxlength="150" required>
            <textarea id="projectDescription" placeholder="Project Description" maxlength="2000" required></textarea>

            <label for="projectCategory" style="display:block;margin-bottom:8px">Project Category</label>
            <select id="projectCategory" required>
                <option value="etp">ETP Plants</option>
                <option value="wtp">WTP, RO &amp; Softener</option>
                <option value="stp">STP Plants</option>
                <option value="om-audit">O&amp;M &amp; Consultancy</option>
            </select>

            <label for="projectImage" style="display:block;margin-bottom:8px">Upload Project Image</label>
            <input type="file" id="projectImage" accept="image/jpeg,image/png,image/webp" required>
            <p id="fileInfo" style="font-size:12px;color:#777;margin-bottom:15px">JPG, PNG or WEBP. Maximum 5 MB.</p>

            <button type="submit" class="primary" id="addBtn">Add Project</button>
            <p id="status" role="status"></p>
        </form>
    </div>

    <div class="card">
        <h3>All Projects</h3>
        <p id="projectCount" style="margin-bottom:15px;color:#777">Loading projects...</p>
        <div id="projectsList"></div>
    </div>
</section>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
    getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
    getFirestore, collection, addDoc, deleteDoc, doc,
    onSnapshot, serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyBCc6ylmz9HwQDEYwJi4DUNG1J6I4N4MD0",
    authDomain: "atharv-enviro-consultant.firebaseapp.com",
    projectId: "atharv-enviro-consultant",
    storageBucket: "atharv-enviro-consultant.firebasestorage.app",
    messagingSenderId: "1082015826670",
    appId: "1:1082015826670:web:6d4b07267c8d79aa64a9ff"
};

const ADMIN_UID = "Wu3mocNPSOh4mlEAXhkkBNsZLVA3";
const CLOUD_NAME = "haq8tww6";
const UPLOAD_PRESET = "aec_projects";

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const loginSection = document.getElementById("loginSection");
const dashboard = document.getElementById("dashboard");
const loginStatus = document.getElementById("loginStatus");
const status = document.getElementById("status");
const addBtn = document.getElementById("addBtn");
const projectsList = document.getElementById("projectsList");
const projectImageInput = document.getElementById("projectImage");
const fileInfo = document.getElementById("fileInfo");

let unsubscribeProjects = null;

projectImageInput.addEventListener("change", () => {
    const file = projectImageInput.files[0];
    if (!file) {
        fileInfo.textContent = "JPG, PNG or WEBP. Maximum 5 MB.";
        return;
    }
    const sizeMb = (file.size / (1024 * 1024)).toFixed(2);
    fileInfo.textContent = `Selected: ${file.name} (${sizeMb} MB)`;
});

document.getElementById("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const loginBtn = document.getElementById("loginBtn");
    loginBtn.disabled = true;
    loginStatus.textContent = "Logging in...";
    try {
        await signInWithEmailAndPassword(
            auth,
            document.getElementById("email").value.trim(),
            document.getElementById("password").value
        );
        loginStatus.textContent = "";
    } catch (error) {
        loginStatus.textContent = "Login failed: " + error.message;
    } finally {
        loginBtn.disabled = false;
    }
});

onAuthStateChanged(auth, async (user) => {
    if (unsubscribeProjects) {
        unsubscribeProjects();
        unsubscribeProjects = null;
    }

    if (user && user.uid === ADMIN_UID) {
        loginSection.style.display = "none";
        dashboard.style.display = "block";
        loadProjects();
    } else {
        dashboard.style.display = "none";
        loginSection.style.display = "block";
        if (user) {
            await signOut(auth);
            loginStatus.textContent = "Access denied. This account is not the configured admin.";
        }
    }
});

document.getElementById("logoutBtn").addEventListener("click", async () => {
    await signOut(auth);
});

document.getElementById("projectForm").addEventListener("submit", async (e) => {
    e.preventDefault();

    const user = auth.currentUser;
    if (!user || user.uid !== ADMIN_UID) {
        status.textContent = "Unauthorized access.";
        return;
    }

    const name = document.getElementById("projectName").value.trim();
    const description = document.getElementById("projectDescription").value.trim();
    const category = document.getElementById("projectCategory").value;
    const imageFile = projectImageInput.files[0];

    const allowedTypes = ["image/jpeg", "image/png", "image/webp"];

    if (!name || !description || !imageFile) {
        status.textContent = "Please fill all fields and select an image.";
        return;
    }
    if (!allowedTypes.includes(imageFile.type)) {
        status.textContent = "Only JPG, PNG and WEBP images are allowed.";
        return;
    }
    if (imageFile.size > 5 * 1024 * 1024) {
        status.textContent = "Image must be under 5 MB.";
        return;
    }

    addBtn.disabled = true;
    addBtn.textContent = "Uploading...";
    status.textContent = "Uploading project image...";

    try {
        const formData = new FormData();
        formData.append("file", imageFile);
        formData.append("upload_preset", UPLOAD_PRESET);
        formData.append("folder", "atharv-enviro/projects");

        const uploadResponse = await fetch(
            `https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`,
            { method: "POST", body: formData }
        );
        const uploadData = await uploadResponse.json();

        if (!uploadResponse.ok || !uploadData.secure_url) {
            throw new Error(uploadData.error?.message || "Cloudinary image upload failed. Check Cloud Name and unsigned preset.");
        }

        status.textContent = "Saving project details...";

        await addDoc(collection(db, "projects"), {
            name,
            description,
            category,
            imageUrl: uploadData.secure_url,
            cloudinaryPublicId: uploadData.public_id || "",
            createdAt: serverTimestamp()
        });

        document.getElementById("projectForm").reset();
        fileInfo.textContent = "JPG, PNG or WEBP. Maximum 5 MB.";
        status.textContent = "Project added successfully!";
    } catch (error) {
        console.error(error);
        status.textContent = "Error: " + error.message;
    } finally {
        addBtn.disabled = false;
        addBtn.textContent = "Add Project";
    }
});

function loadProjects() {
    const projectsRef = collection(db, "projects");

    unsubscribeProjects = onSnapshot(projectsRef, (snapshot) => {
        projectsList.replaceChildren();

        document.getElementById("projectCount").textContent =
            "Total Projects: " + snapshot.size;

        if (snapshot.empty) {
            projectsList.textContent = "No projects added yet.";
            return;
        }

        const projects = snapshot.docs.slice().sort((a, b) => {
            const aTime = a.data().createdAt?.seconds || 0;
            const bTime = b.data().createdAt?.seconds || 0;
            return bTime - aTime;
        });

        projects.forEach((projectDoc) => {
            const project = projectDoc.data();
            const item = document.createElement("div");
            item.className = "project";

            const img = document.createElement("img");
            img.src = project.imageUrl || "";
            img.alt = project.name || "Project";
            img.loading = "lazy";

            const info = document.createElement("div");
            info.className = "project-info";

            const title = document.createElement("strong");
            title.textContent = project.name || "Untitled";

            const desc = document.createElement("p");
            desc.textContent = project.description || "";

            const category = document.createElement("small");
            const categoryNames = {
                "etp": "ETP Plants",
                "wtp": "WTP, RO & Softener",
                "stp": "STP Plants",
                "om-audit": "O&M & Consultancy"
            };
            category.textContent = categoryNames[project.category] || "ETP Plants";

            info.append(title, desc, category);

            const deleteButton = document.createElement("button");
            deleteButton.className = "delete";
            deleteButton.type = "button";
            deleteButton.textContent = "Delete";

            deleteButton.addEventListener("click", async () => {
                if (!auth.currentUser || auth.currentUser.uid !== ADMIN_UID) {
                    alert("Unauthorized access.");
                    return;
                }
                if (!confirm("Are you sure you want to delete this project?")) return;

                deleteButton.disabled = true;
                try {
                    await deleteDoc(doc(db, "projects", projectDoc.id));
                } catch (error) {
                    alert("Delete failed: " + error.message);
                    deleteButton.disabled = false;
                }
            });

            item.append(img, info, deleteButton);
            projectsList.appendChild(item);
        });
    }, (error) => {
        console.error(error);
        projectsList.textContent = "Unable to load projects: " + error.message;
    });
}
</script>
</body>
</html>
